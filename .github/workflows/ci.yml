name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单元测试 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-android@v3 会安装已被 Google 移除的旧 tools 包，在新版 runner 上必然失败。
      # ubuntu-latest 已预装 cmdline-tools，这里直接接受许可并补齐所需 SDK 组件。
      - name: 配置 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: 确保 Gradle Wrapper 可执行
        run: chmod +x gradlew

      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 静态检查
        run: ./gradlew --no-daemon lintDebug

      - name: 构建 Debug 包
        run: ./gradlew --no-daemon assembleDebug

      - name: 构建 Release 包（含 R8）
        run: ./gradlew --no-daemon assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: skipad-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
          if-no-files-found: ignore
